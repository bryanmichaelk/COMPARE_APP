name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: main-release-pipeline
  cancel-in-progress: false

jobs:
  version:
    uses: ./.github/workflows/calculate-version.yml

  build-publish:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Resolve image name
        id: image
        if: needs.version.outputs.tag != ''
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/compare-app" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: needs.version.outputs.tag != ''
      - uses: docker/login-action@v3
        if: needs.version.outputs.tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing image tag
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ needs.version.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$(curl --fail --silent --show-error --get \
            --data-urlencode "scope=repository:${IMAGE#ghcr.io/}:pull" \
            -u "$GITHUB_ACTOR:$TOKEN" https://ghcr.io/token)"
          REGISTRY_TOKEN="$(jq -er '.token' <<< "$AUTH")"
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --head \
            -H "Authorization: Bearer $REGISTRY_TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/$TAG")"
          case "$STATUS" in
            404) ;;
            200) echo '::error::Image tag already exists; refusing overwrite.'; exit 1 ;;
            *) echo "::error::Image lookup failed (HTTP $STATUS)."; exit 1 ;;
          esac
      - name: Build and publish
        if: needs.version.outputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
      - name: Tag published source
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Invalid version tag.'; exit 1; }
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [ "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" ] || { echo '::error::Version tag already points elsewhere.'; exit 1; }
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" "$GITHUB_SHA" -m "Published image $TAG"
          git push origin "refs/tags/$TAG"
